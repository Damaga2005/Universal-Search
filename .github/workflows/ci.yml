name: CI

# Phase 020: the gates that must pass before anything is released.
# Windows is the supported platform and gates the build. Ubuntu runs the
# suite as a *probe* of the platform-independent core (phase 016): it is
# allowed to fail without blocking a release, because the GUI, the
# registry, the hotkey and the installer scripts are Windows-only by
# design, and a red X on a job nobody can fix is worse than an honest
# non-gating signal.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled: a stale red build is noise, and the newest
# commit is the only one that can gate a release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: tests, lint and migrations (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      # Phase 048. This was pinned to 3.12 while `requires-python` promised
      # ">=3.12" and the development machine ran 3.14: the promise and the proof
      # were different sets. `requires-python` is now bounded at <3.15, and this
      # matrix covers exactly the range it declares.
      #
      # The full suite runs on every version; the per-phase suites below run on
      # the lowest and the highest, because the middle one adds little and CI
      # minutes are a real cost. The gate is in the minimum-version job so that
      # a version nobody gates is never the one that ships.
      #
      # NOT EXECUTED BY THE AUTHOR: this matrix has never been run -- the change
      # was made without CI access. What is measured, and what the 048 report
      # says, is the full suite on 3.14.6. Treat 3.12 and 3.13 as declared and
      # configured, not as proven, until a green run says otherwise.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyflakes

      - name: Static analysis (pyflakes)
        run: python -m pyflakes src tests benchmarks evaluation

      - name: Full test suite
        run: python -m pytest tests -q

      - name: Schema version is consistent
        run: |
          python -c "from universal_search.index.database import SCHEMA_VERSION; print(SCHEMA_VERSION)"
          python -c "import universal_search; print(universal_search.__version__)"

      - name: Migrations and reliability regressions
        run: python -m pytest tests/test_release.py tests/test_reliability.py -q

      - name: Search-quality regression (phase 013 baseline)
        run: python -m pytest tests/test_evaluation.py tests/test_ranking.py -q

      - name: Security regressions (phase 018)
        run: python -m pytest tests/test_privacy.py -q

      # Phase 029: the per-phase suites stay named in the log. A regression in
      # one layer should identify itself instead of hiding inside a 900-test
      # run, and every gate below is also asserted by tests/test_ci_gates.py.
      - name: Observability and recovery regressions (phase 028)
        run: python -m pytest tests/test_observability.py tests/test_recovery.py -q

      - name: Shell integration regressions (phase 027)
        run: python -m pytest tests/test_windows_shell.py -q

      - name: Release contract (CI gates, version pinning, dependency budget)
        run: python -m pytest tests/test_ci_gates.py -q

      # Phase 040: the gate grew to 23 invariants. The suite that tests the
      # gate has to be gated too, or the invariants added last are the first
      # to rot unnoticed.
      - name: Quality gate suite (23 invariants, phase 040)
        run: python -m pytest tests/test_v2_gate.py tests/test_perf_gate.py tests/test_accessibility.py -q

      # Phase 030: the v2 gate is a command, and CI runs it like any other
      # gate. It re-reads the tree it is shipped with, so a stale count or an
      # undeclared table fails the build instead of the next release.
      - name: Universal Search v2 quality gate
        run: python -m evaluation.gate

      # Phase 049. `distribution_gate` has existed since phase 037 with eleven
      # invariants about portable mode and the single-file executable, and this
      # line is the first time it was ever run by the build. It is the only gate
      # that executes a real artefact, which is exactly why its absence from CI
      # mattered: a gate nothing runs is a document with a `main()`.
      - name: Distribution gate (portable layout, single-file artefact)
        run: python -m evaluation.distribution_gate

      # Phase 049: the support matrix is a claim about the environment, and a
      # claim that nothing checks rots. This asserts that the interpreter
      # running the suite is inside the range `requires-python` declares.
      - name: Portability gate (declared support matches what CI proves)
        run: python -m evaluation.portability_gate

  core-portability:
    name: platform-independent core (probe, non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e . pytest

      - name: Core suite without Windows-only assumptions
        run: |
          python -m pytest tests \
            -q \
            --ignore=tests/test_gui.py \
            --ignore=tests/test_gui_ux.py \
            --ignore=tests/test_hotkey.py \
            --ignore=tests/test_release.py

  package:
    name: Windows build and smoke test
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with the build extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]" pytest

      - name: Build the executables
        run: python -m PyInstaller packaging/universal-search.spec --noconfirm

      # Phase 037: the single-file build is a second artefact, and the 2.0.0
      # release shipped two bare .exe files that did not run (PYI-8: Failed to
      # load Python DLL) because a one-dir build needs _internal/. So it is
      # built here and then executed *alone*, from a folder with no siblings.
      - name: Build the single-file executable
        run: |
          python -m PyInstaller packaging/universal-search-onefile.spec `
            --noconfirm --distpath dist/UniversalSearch-onefile

      - name: Smoke test the packaged CLI
        shell: pwsh
        run: |
          $exe = "dist\UniversalSearch\universal-search.exe"
          $gui = "dist\UniversalSearch\UniversalSearch.exe"
          if (-not (Test-Path $exe)) { throw "CLI executable missing" }
          if (-not (Test-Path $gui)) { throw "GUI executable missing" }
          & $exe --version
          $tmp = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force -Path "$tmp\docs" | Out-Null
          "transistor bjt polarizacion" | Out-File -Encoding utf8 "$tmp\docs\nota.md"
          & $exe index "$tmp\docs" --database "$tmp\index.db"
          & $exe search "bjt" --database "$tmp\index.db"
          & $exe diagnose health --database "$tmp\index.db"
          & $exe diagnose self-test
          & $exe diagnose export --output "$tmp\support.json"
          & $exe diagnose recover orphan-derived
          & $exe privacy show --database "$tmp\index.db"
          & $exe extensions
          # The GUI executable must at least start and be asked to quit by the
          # runner; a windowed build that dies on import ships a broken app.
          $process = Start-Process -FilePath $gui -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "GUI executable exited immediately" }
          Stop-Process -Id $process.Id -Force

      - name: Smoke test the single-file executable alone
        shell: pwsh
        run: |
          # Copied somewhere with nothing else in the folder: if this fails,
          # the artefact we publish is one that does not start.
          $built = "dist\UniversalSearch-onefile\UniversalSearch.exe"
          if (-not (Test-Path $built)) { throw "single-file executable missing" }
          $alone = Join-Path $env:RUNNER_TEMP "onefile-alone"
          New-Item -ItemType Directory -Force -Path $alone | Out-Null
          $lonely = Join-Path $alone "UniversalSearch.exe"
          Copy-Item $built $lonely
          $env:UNIVERSAL_SEARCH_HOME = Join-Path $alone "home"
          & $lonely --version
          if ($LASTEXITCODE -ne 0) { throw "the single-file executable did not answer --version" }
          $docs = Join-Path $alone "docs"
          New-Item -ItemType Directory -Force -Path $docs | Out-Null
          "transistor bjt polarizacion" | Out-File -Encoding utf8 "$docs\nota.md"
          & $lonely index $docs --database "$alone\index.db"
          # -match is a FILTER operator on an array, so join first; otherwise
          # this throws whenever any line of output lacks the file name.
          $found = (& $lonely search "transisto" --database "$alone\index.db") -join "`n"
          if ($found -notmatch "nota\.md") {
            throw "the single-file executable did not retrieve the indexed document"
          }
          # Portable mode has to work from the folder the executable sits in.
          & $lonely portable on --base $alone
          $status = & $lonely portable status
          if (($status -join " ") -notmatch [regex]::Escape($alone)) {
            throw "portable status did not report the portable data directory"
          }

      # Phase 049. This step existed and produced `artifacts.sha256` with
      # *absolute* paths from the runner -- `D:\a\universal-search\...` --
      # so `sha256sum -c` on a user's machine reported every artefact missing.
      # Nothing in the repository ever read the file back; the only test
      # asserted that the string "artifacts.sha256" appears in this workflow.
      #
      # Now: the one-dir build is zipped (uploading only `*.exe` without
      # `_internal/` published two executables that cannot start -- the exact
      # PYI-8 defect the release audit recorded for 2.0.0), the manifest lists
      # paths *relative to itself*, and the packaged files are verified by the
      # same script a user would run.
      - name: Package the one-dir build and record verifiable hashes
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\UniversalSearch\*" `
            -DestinationPath "dist\UniversalSearch-{#}.zip" -Force -ErrorAction Stop
          $manifest = @()
          Get-ChildItem -Path "dist\UniversalSearch\*.exe", `
                         "dist\UniversalSearch-onefile\*.exe", `
                         "dist\UniversalSearch-*.zip" |
            ForEach-Object {
              # Relative to `dist`, because a path from this runner is useless
              # on the machine the manifest exists to be checked on.
              $relative = Resolve-Path -Relative -Path $_.FullName
              $manifest += ("{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash,
                                          ($relative -replace '^\.\\', '' -replace '\\', '/'))
            }
          # The zip's own bytes change on every build, so it is hashed here but
          # its digest is not reproducible; what is verified is the archive
          # against the release, by re-hashing after upload.
          $manifest | Out-File -Encoding ascii "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Verify the hashes with the script a user would run
        shell: pwsh
        run: |
          # Extract the zip we are about to publish and check the executables
          # inside it, so the manifest is verified against the published
          # layout rather than against the build tree.
          $check = Join-Path $env:RUNNER_TEMP "verify"
          Remove-Item -Recurse -Force $check -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $check | Out-Null
          Expand-Archive -Path "dist\UniversalSearch-*.zip" -DestinationPath $check -Force
          $lines = Get-Content "dist\SHA256SUMS.txt" |
            Where-Object { $_ -match "UniversalSearch/.*\.exe$" } |
            ForEach-Object { $_ -replace 'UniversalSearch/', '' }
          $lines | Out-File -Encoding ascii (Join-Path $check "SHA256SUMS.txt")
          & packaging\verify-hashes.ps1 -Path $check
          if ($LASTEXITCODE -ne 0) { throw "published layout failed hash verification" }

      # The support bundle is content-free by construction (phase 028), so it
      # is safe to attach to a build: a failure report that a maintainer can
      # read without asking the reporter to paste anything.
      - name: Attach the sanitized support bundle
        if: always()
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "smoke\support.json"
          if (Test-Path $bundle) { Copy-Item $bundle artifacts-support.json }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-search-windows
          path: |
            dist/UniversalSearch-*.zip
            dist/UniversalSearch-onefile/*.exe
            dist/SHA256SUMS.txt
            artifacts-support.json
          retention-days: 30
