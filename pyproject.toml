[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-search"
version = "0.1.0"
description = "Local-first universal search for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Damaga2005"}]
dependencies = []

[project.scripts]
universal-search = "universal_search.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_search"]
